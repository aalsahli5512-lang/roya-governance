<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a365d'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23d4af37' font-family='Arial' font-weight='bold' font-size='28'%3ER%3C/text%3E%3C/svg%3E">
    <title>الصفحة غير موجودة | رؤية للحوكمة والمخاطر والالتزام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--primary:#1a365d;--secondary:#c9a227;--accent:#2d3748;--gray:#718096;--white:#ffffff;--gradient:linear-gradient(135deg,#1a365d 0%,#2c5282 100%);--shadow:0 10px 40px rgba(0,0,0,0.1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Tajawal',sans-serif;background:var(--white);color:var(--accent);line-height:1.8;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
        .container{padding:2rem}
        .error-code{font-size:8rem;font-weight:900;color:var(--primary);line-height:1}
        h1{font-size:2rem;color:var(--primary);margin:1rem 0}
        p{color:var(--gray);margin-bottom:2rem}
        .btn{display:inline-block;background:var(--gradient);color:var(--white);padding:1rem 2.5rem;border-radius:50px;text-decoration:none;font-weight:600;transition:all 0.3s}
        .btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(26,54,93,0.4)}
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p>عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها</p>
        <a href="index.html" class="btn">
            <i class="fas fa-arrow-right"></i>
            العودة للرئيسية
        </a>
    </div>
</body>
</html>
