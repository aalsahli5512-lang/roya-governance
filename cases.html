<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="دراسات حالة وأعمال سابقة لرؤية للحوكمة والمخاطر والالتزام في مجال الحوكمة والمخاطر والالتزام">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a365d'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23d4af37' font-family='Arial' font-weight='bold' font-size='28'%3ER%3C/text%3E%3C/svg%3E">
    <title>دراسات الحالة | رؤية للحوكمة والمخاطر والالتزام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--primary:#1a365d;--secondary:#c9a227;--accent:#2d3748;--light:#f7fafc;--gray:#718096;--white:#ffffff;--gradient:linear-gradient(135deg,#1a365d 0%,#2c5282 100%);--shadow:0 10px 40px rgba(0,0,0,0.1);--radius:12px;--transition:all 0.3s}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Tajawal',sans-serif;background:var(--white);color:var(--accent);line-height:1.8}
        .navbar{position:fixed;top:0;width:100%;padding:1rem 5%;display:flex;justify-content:space-between;align-items:center;z-index:1000;background:rgba(255,255,255,0.98);box-shadow:var(--shadow)}
        .nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
        .nav-logo-icon{width:48px;height:48px;background:var(--gradient);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:1.4rem}
        .nav-logo-text{font-size:1.3rem;font-weight:800;color:var(--primary)}
        .nav-logo-text span{color:var(--secondary)}
        .nav-links{display:flex;list-style:none;gap:2rem;align-items:center}
        .nav-links a{text-decoration:none;color:var(--accent);font-weight:500;font-size:0.95rem}
        .nav-cta{background:var(--gradient)!important;color:var(--white)!important;padding:0.6rem 1.5rem;border-radius:50px;font-weight:600!important;text-decoration:none}
        .section{padding:6rem 5%;max-width:1100px;margin:0 auto}
        .section-header{text-align:center;margin-bottom:4rem}
        .section-tag{display:inline-block;background:rgba(201,162,39,0.1);color:var(--secondary);padding:0.4rem 1.2rem;border-radius:50px;font-size:0.85rem;font-weight:600;margin-bottom:1rem}
        .section-title{font-size:2.5rem;font-weight:800;color:var(--primary);margin-bottom:1rem}
        .cases-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2rem}
        .case-card{background:var(--white);border-radius:var(--radius);padding:2rem;border:1px solid rgba(0,0,0,0.05);transition:var(--transition)}
        .case-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
        .case-icon{width:60px;height:60px;background:var(--gradient);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:1.5rem;margin-bottom:1rem}
        .case-card h3{color:var(--primary);margin-bottom:0.5rem}
        .case-card p{color:var(--gray);font-size:0.9rem}
        .footer{background:var(--accent);color:var(--white);padding:2rem 5%;text-align:center;margin-top:4rem}
        .footer a{color:var(--secondary);text-decoration:none}
        @media(max-width:768px){.cases-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon"><i class="fas fa-shield-halved"></i></div>
            <span class="nav-logo-text">رؤية <span>الحوكمة</span></span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html#home">الرئيسية</a></li>
            <li><a href="index.html#services">خدماتنا</a></li>
            <li><a href="index.html#contact" class="nav-cta">تواصل معنا</a></li>
        </ul>
    </nav>

    <section class="section">
        <div class="section-header" style="padding-top:4rem">
            <span class="section-tag">دراسات الحالة</span>
            <h2 class="section-title">أعمالنا ومشاريعنا</h2>
        </div>
        <div class="cases-grid">
            <div class="case-card">
                <div class="case-icon"><i class="fas fa-building"></i></div>
                <h3>حوكمة شركة مالية</h3>
                <p>ساعدنا في بناء منظومة حوكمة متكاملة</p>
            </div>
            <div class="case-card">
                <div class="case-icon"><i class="fas fa-shield-alt"></i></div>
                <h3>إدارة المخاطر</h3>
                <p>تطوير إطار عمل لإدارة المخاطر</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>© 2024 رؤية للحوكمة والمخاطر والالتزام. جميع الحقوق محفوظة. | <a href="index.html">العودة للموقع</a></p>
    </footer>
</body>
</html>
